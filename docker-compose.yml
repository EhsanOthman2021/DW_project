services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fatura-api

    ports:
      - "8080:8080"

    environment:
      DISABLE_S3_DOWNLOAD: "1"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "eu-north-1"

    restart: always
