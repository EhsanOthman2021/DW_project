[project]
name = "DW_project"
version = "0.1.0"
description = "Data engineering project for FATURA2 invoices"
authors = [{ name = "Ehsan Othman", email = "ehsan.othman.2021@gmail.com" }]
dependencies = [
    "accelerate>=1.12.0",
    "boto3>=1.42.2",
    "datasets>=4.4.1",
    "fastapi>=0.123.9",
    "openai>=2.8.1",
    "pdf2image>=1.17.0",
    "pillow>=12.0.0",
    "plotly>=6.5.0",
    "pymupdf>=1.26.6",
    "pytesseract>=0.3.13",
    "sentence-transformers>=5.1.2",
    "torch>=2.9.1",
    "transformers>=4.57.3",
    "uvicorn>=0.38.0",
    "xgboost>=3.1.2",
]

[tool.uv]
# Python version for the environment
python = "3.11"

[tool.uv.dependencies]
# Core dependencies
dvc = "*"              # Data Version Control
requests = "*"         # HTTP requests for APIs
numpy = "*"            # Numerical operations
pandas = "*"           # DataFrames
torch = {version="*", extras=["cuda"]}   # PyTorch with CUDA
torchvision = "*"                        # Useful for image transforms
# Optional: DVC cloud support
# Uncomment the one you need:
# dvc[s3] = "*"        # For Amazon S3
# dvc[gdrive] = "*"    # For Google Drive
# dvc[azure] = "*"     # For Azure Blob
# dvc[gs] = "*"        # For Google Cloud Storage
